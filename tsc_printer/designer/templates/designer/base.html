<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TSC Label Designer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Libre+Franklin:wght@400;500;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Source+Code+Pro:wght@400;500;700&family=Oswald:wght@400;500;700&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1e1e2e; color: #cdd6f4; overflow: hidden; height: 100vh;
        }

        /* Title Bar */
        .app-titlebar {
            height: 32px; background: #11111b; display: flex; align-items: center;
            padding: 0 12px; border-bottom: 1px solid #313244; user-select: none;
        }
        .app-titlebar .app-icon { font-size: 14px; color: #89b4fa; margin-right: 8px; }
        .app-titlebar .app-name { font-size: 12px; font-weight: 600; color: #cdd6f4; letter-spacing: 0.5px; }
        .app-titlebar .window-controls { margin-left: auto; display: flex; gap: 2px; }
        .app-titlebar .win-btn {
            width: 28px; height: 28px; border: none; background: transparent;
            color: #6c7086; font-size: 11px; display: flex; align-items: center;
            justify-content: center; cursor: default; border-radius: 4px;
        }
        .app-titlebar .win-btn:hover { background: #313244; color: #cdd6f4; }

        /* Menu Bar */
        .app-menubar {
            height: 30px; background: #181825; display: flex; align-items: center;
            padding: 0 8px; border-bottom: 1px solid #313244; font-size: 12px;
        }
        .menu-item {
            padding: 4px 10px; color: #a6adc8; cursor: pointer; border-radius: 4px;
            text-decoration: none; transition: all 0.1s;
        }
        .menu-item:hover { background: #313244; color: #cdd6f4; }
        .menu-item.active { background: #45475a; color: #cdd6f4; }

        /* Main content area */
        .app-content {
            height: calc(100vh - 86px);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Status Bar */
        .app-statusbar {
            height: 24px; background: #11111b; display: flex; align-items: center;
            padding: 0 12px; border-top: 1px solid #313244;
            font-size: 11px; color: #6c7086; flex-shrink: 0;
        }
        .status-item { padding: 0 12px; border-right: 1px solid #313244; }
        .status-item:last-child { border-right: none; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .status-dot.green { background: #a6e3a1; }
        .status-dot.yellow { background: #f9e2af; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e2e; }
        ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #585b70; }

        /* Buttons */
        .btn-app {
            background: #313244; border: 1px solid #45475a; color: #cdd6f4;
            font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
            transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px;
        }
        .btn-app:hover { background: #45475a; color: #cdd6f4; border-color: #585b70; }
        .btn-app.primary { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; font-weight: 500; }
        .btn-app.primary:hover { background: #74c7ec; border-color: #74c7ec; }
        .btn-app.success { background: #a6e3a1; color: #1e1e2e; border-color: #a6e3a1; font-weight: 500; }
        .btn-app.success:hover { background: #94e2d5; border-color: #94e2d5; }
        .btn-app.danger { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
        .btn-app.danger:hover { background: #eba0ac; border-color: #eba0ac; }

        /* Form controls */
        .form-dark {
            background: #313244; border: 1px solid #45475a; color: #cdd6f4;
            font-size: 12px; padding: 4px 8px; border-radius: 4px; width: 100%;
        }
        .form-dark:focus { outline: none; border-color: #89b4fa; background: #313244; color: #cdd6f4; }
        select.form-dark { cursor: pointer; }
        .form-dark::placeholder { color: #6c7086; }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- Title Bar -->
    <div class="app-titlebar">
        <i class="bi bi-printer app-icon"></i>
        <span class="app-name">TSC Label Designer Pro</span>
        <span style="margin-left: 16px; font-size: 11px; color: #6c7086;">{% block subtitle %}{% endblock %}</span>
        <div class="window-controls">
            <div class="win-btn"><i class="bi bi-dash"></i></div>
            <div class="win-btn"><i class="bi bi-square"></i></div>
            <div class="win-btn" style="border-radius: 0 4px 4px 0;"><i class="bi bi-x-lg"></i></div>
        </div>
    </div>

    <!-- Menu Bar -->
    <div class="app-menubar">
        <a href="{% url 'designer:design_list' %}" class="menu-item {% block menu_file %}{% endblock %}">
            <i class="bi bi-folder2-open"></i> File Manager
        </a>
        <a href="{% url 'designer:design_create' %}" class="menu-item {% block menu_new %}{% endblock %}">
            <i class="bi bi-plus-square"></i> New Design
        </a>
        {% block menu_extra %}{% endblock %}
    </div>

    <!-- Content -->
    <div class="app-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Status Bar -->
    <div class="app-statusbar">
        {% block statusbar %}
        <span class="status-item"><span class="status-dot green"></span> Ready</span>
        <span class="status-item">TSC Label Designer v1.0</span>
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
