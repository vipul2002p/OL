{% extends "designer/base.html" %}
{% block title %}Delete {{ design.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle display-3 text-warning"></i>
                <h4 class="mt-3">Delete "{{ design.name }}"?</h4>
                <p class="text-muted">This action cannot be undone. The design and all associated files will be permanently deleted.</p>
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'designer:design_list' %}" class="btn btn-secondary">Cancel</a>
                    <form method="post" action="{% url 'designer:design_delete' design.id %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
